services:
  - type: web
    name: footy-ai
    env: python
    plan: free
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt && cd client && npm install && npm run build && cd ..
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
