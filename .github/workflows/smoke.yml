name: Smoke (prod)

# Hits the live deployment to catch production-only failures (e.g. the DuckDB
# httpfs hang). Runs on a schedule and on demand — doubles as light monitoring.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  smoke:
    name: Production smoke tests
    runs-on: ubuntu-latest
    env:
      RUN_SMOKE: "1"
      FOOTY_PROD_URL: https://footy-ai-u99r.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run production smoke tests
        run: pytest -m smoke
