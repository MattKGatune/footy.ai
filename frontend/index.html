<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>footy.ai</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a4a;
      padding: 14px 32px;
      display: flex;
      align-items: center;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    header h1 span { color: #6c63ff; }

    /* ── Controls ────────────────────────────────── */
    .controls {
      padding: 20px 32px 12px;
      display: flex;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    select {
      background: #1e1e2e;
      color: #e0e0e0;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.875rem;
      min-width: 200px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus { border-color: #6c63ff; }
    select:disabled { opacity: 0.35; cursor: not-allowed; }

    .loading {
      color: #6c63ff;
      font-size: 0.8rem;
      padding-bottom: 10px;
      display: none;
    }

    /* ── Scoreboard ──────────────────────────────── */
    .scoreboard {
      margin: 4px 32px 0;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 20px 32px;
      display: none;
    }

    .scoreboard-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
    }

    .sb-team {
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .sb-team.home { color: #6c63ff; text-align: right; }
    .sb-team.away { color: #e63946; text-align: left; }

    .sb-center { text-align: center; }

    .sb-score {
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: 6px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .sb-meta {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ── Charts ──────────────────────────────────── */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 32px 0;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      padding: 16px;
    }

    .card h2 {
      font-size: 0.7rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .placeholder {
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      font-size: 0.85rem;
    }

    #shot-map, #win-prob { height: 400px; }

    /* ── Stats Table ─────────────────────────────── */
    .stats-section {
      padding: 20px 32px 32px;
      display: none;
    }

    .stats-section .card { padding: 20px 24px; }

    .stats-header {
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid #2a2a4a;
    }

    .stats-header .sh-home {
      color: #6c63ff;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: right;
    }

    .stats-header .sh-away {
      color: #e63946;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #151525;
    }

    .stat-val {
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-val.home { color: #6c63ff; text-align: right; }
    .stat-val.away { color: #e63946; }

    .stat-mid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }

    .stat-label {
      font-size: 0.68rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-bar {
      display: flex;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      overflow: hidden;
      background: #0f1117;
    }

    .bar-home { background: #6c63ff; height: 100%; }
    .bar-away { background: #e63946; height: 100%; }

    /* ── Narrative ───────────────────────────────── */
    .narrative-section {
      padding: 0 32px 40px;
      display: none;
    }

    .narrative-section .card { padding: 20px 24px; }

    .narrative-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .narrative-header h2 {
      margin-bottom: 0;
    }

    #narrative-btn {
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.15s;
    }

    #narrative-btn:hover { background: #574fd6; }
    #narrative-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .narrative-summary {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .narrative-moments {
      list-style: none;
      margin-bottom: 18px;
    }

    .narrative-moments li {
      padding: 6px 0 6px 18px;
      position: relative;
      font-size: 0.85rem;
      color: #bbb;
      border-bottom: 1px solid #151525;
      line-height: 1.5;
    }

    .narrative-moments li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #6c63ff;
    }

    .narrative-tactical {
      font-size: 0.85rem;
      color: #999;
      font-style: italic;
      line-height: 1.6;
      border-left: 2px solid #6c63ff;
      padding-left: 12px;
    }

    .narrative-loading {
      color: #555;
      font-size: 0.85rem;
      padding: 20px 0;
      text-align: center;
    }

    .narrative-error {
      color: #e63946;
      font-size: 0.85rem;
      padding: 12px 0;
    }
  </style>
</head>
<body>

<header>
  <h1>footy<span>.ai</span></h1>
</header>

<div class="controls">
  <div class="control-group">
    <label for="comp-select">Competition</label>
    <select id="comp-select">
      <option value="">Select competition...</option>
    </select>
  </div>
  <div class="control-group">
    <label for="home-select">Home team</label>
    <select id="home-select" disabled>
      <option value="">Select home team...</option>
    </select>
  </div>
  <div class="control-group">
    <label for="away-select">Away team</label>
    <select id="away-select" disabled>
      <option value="">Select away team...</option>
    </select>
  </div>
  <span class="loading" id="loading">Loading...</span>
</div>

<div class="scoreboard" id="scoreboard">
  <div class="scoreboard-inner">
    <div class="sb-team home" id="sb-home"></div>
    <div class="sb-center">
      <div class="sb-score" id="sb-score"></div>
      <div class="sb-meta" id="sb-meta"></div>
    </div>
    <div class="sb-team away" id="sb-away"></div>
  </div>
</div>

<div class="charts">
  <div class="card">
    <h2>Shot Map</h2>
    <div id="shot-map"><div class="placeholder">Select a match to view shots</div></div>
  </div>
  <div class="card">
    <h2>Win Probability</h2>
    <div id="win-prob"><div class="placeholder">Select a match to view win probability</div></div>
  </div>
</div>

<div class="stats-section" id="stats-section">
  <div class="card">
    <h2>Match Stats</h2>
    <div id="stats-table"></div>
  </div>
</div>

<div class="narrative-section" id="narrative-section">
  <div class="card">
    <div class="narrative-header">
      <h2>Match Analysis</h2>
      <button id="narrative-btn">Generate AI Analysis</button>
    </div>
    <div id="narrative-content"></div>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:8000";
  const BG  = "#1a1a2e";
  const PLOT_BG = "#12122a";

  let allMatches = [];
  let currentMatchId = null;

  /* ── Data loading ──────────────────────────────── */

  async function loadMatches() {
    const res = await fetch(`${API}/matches`);
    allMatches = await res.json();

    const competitions = [...new Map(
      allMatches.map(m => [m.competition_name, m.competition_name])
    ).entries()].sort((a, b) => a[0].localeCompare(b[0]));

    const compSel = document.getElementById("comp-select");
    competitions.forEach(([name]) => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      compSel.appendChild(opt);
    });
  }

  function onCompChange() {
    const comp = document.getElementById("comp-select").value;
    const homeSel = document.getElementById("home-select");
    const awaySel = document.getElementById("away-select");

    homeSel.innerHTML = '<option value="">Select home team...</option>';
    awaySel.innerHTML = '<option value="">Select away team...</option>';
    awaySel.disabled = true;
    hideMatch();

    if (!comp) { homeSel.disabled = true; return; }

    const teams = [...new Set(
      allMatches.filter(m => m.competition_name === comp).map(m => m.home_team)
    )].sort();

    teams.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t; opt.textContent = t;
      homeSel.appendChild(opt);
    });
    homeSel.disabled = false;
  }

  function onHomeChange() {
    const comp = document.getElementById("comp-select").value;
    const home = document.getElementById("home-select").value;
    const awaySel = document.getElementById("away-select");

    awaySel.innerHTML = '<option value="">Select away team...</option>';
    hideMatch();

    if (!home) { awaySel.disabled = true; return; }

    const teams = [...new Set(
      allMatches
        .filter(m => m.competition_name === comp && m.home_team === home)
        .map(m => m.away_team)
    )].sort();

    teams.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t; opt.textContent = t;
      awaySel.appendChild(opt);
    });
    awaySel.disabled = false;
  }

  function onAwayChange() {
    const comp = document.getElementById("comp-select").value;
    const home = document.getElementById("home-select").value;
    const away = document.getElementById("away-select").value;
    if (!away) return;

    const match = allMatches.find(m =>
      m.competition_name === comp && m.home_team === home && m.away_team === away
    );
    if (match) loadMatch(match);
  }

  function hideMatch() {
    currentMatchId = null;
    document.getElementById("scoreboard").style.display = "none";
    document.getElementById("stats-section").style.display = "none";
    document.getElementById("narrative-section").style.display = "none";
    document.getElementById("narrative-content").innerHTML = "";
    const btn = document.getElementById("narrative-btn");
    btn.disabled = false;
    btn.textContent = "Generate AI Analysis";
  }

  async function loadMatch(meta) {
    const loading = document.getElementById("loading");
    loading.style.display = "inline";

    try {
      const [shotsRes, timelineRes] = await Promise.all([
        fetch(`${API}/matches/${meta.match_id}/shots`),
        fetch(`${API}/matches/${meta.match_id}/timeline`)
      ]);

      if (!shotsRes.ok || !timelineRes.ok) {
        console.error("API error", shotsRes.status, timelineRes.status);
        loading.style.display = "none";
        return;
      }

      const shots    = await shotsRes.json();
      const timeline = await timelineRes.json();
      loading.style.display = "none";

      if (!shots.length || !timeline.length) return;

      const homeTeam = timeline[0].home_team;
      const awayTeam = timeline[0].away_team;

      currentMatchId = meta.match_id;
      renderScoreboard(meta, homeTeam, awayTeam);
      renderShotMap(shots, homeTeam, awayTeam);
      renderTimeline(timeline, homeTeam, awayTeam);
      renderStatsTable(shots, homeTeam, awayTeam);
      document.getElementById("narrative-section").style.display = "block";

    } catch (err) {
      console.error("Failed to load match:", err);
      loading.style.display = "none";
    }
  }

  /* ── Scoreboard ────────────────────────────────── */

  function renderScoreboard(meta, homeTeam, awayTeam) {
    document.getElementById("sb-home").textContent  = homeTeam;
    document.getElementById("sb-away").textContent  = awayTeam;
    document.getElementById("sb-score").textContent = `${meta.home_score} — ${meta.away_score}`;

    const date = meta.match_date
      ? new Date(meta.match_date).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })
      : "";
    document.getElementById("sb-meta").textContent =
      [meta.competition_name, date].filter(Boolean).join("  ·  ");

    document.getElementById("scoreboard").style.display = "block";
  }

  /* ── Shot Map ──────────────────────────────────── */

  function renderShotMap(shots, homeTeam, awayTeam) {
    const teams = [...new Set(shots.map(s => s.team_name))];

    const traces = teams.map(team => {
      const ts = shots.filter(s => s.team_name === team).map(s => {
        const x = s.is_home ? s.location_x : 120 - s.location_x;
        const y = s.is_home ? s.location_y : 80  - s.location_y;
        return { ...s, px: x, py: y };
      });
      const isHome = ts[0]?.is_home ?? true;

      return {
        x: ts.map(s => s.px),
        y: ts.map(s => s.py),
        mode: "markers",
        name: team,
        marker: {
          size: ts.map(s => (s.xg_pred || 0.05) * 60 + 6),
          color: isHome ? "#6c63ff" : "#e63946",
          symbol: ts.map(s => s.shot_outcome === "Goal" ? "star" : "circle"),
          line: { color: "white", width: 1 },
          opacity: 0.85
        },
        text: ts.map(s =>
          `${s.player_name}<br>Min ${s.minute}<br>xG: ${(s.xg_pred||0).toFixed(2)}<br>${s.shot_outcome}`
        ),
        hoverinfo: "text",
        type: "scatter"
      };
    });

    const pitchShapes = [
      rect(0, 0, 120, 80),
      rect(102, 18, 120, 62),
      rect(0, 18, 18, 62),
      rect(114, 30, 120, 50),
      rect(0, 30, 6, 50),
      line(60, 0, 60, 80),
      { type: "circle", x0: 50, y0: 30, x1: 70, y1: 50, line: { color: "rgba(255,255,255,0.5)", width: 1 } },
      rect(120, 36, 122, 44),
      rect(-2, 36, 0, 44),
    ];

    Plotly.newPlot("shot-map", traces, {
      shapes: pitchShapes,
      plot_bgcolor: "#2d6a2d",
      paper_bgcolor: BG,
      font: { color: "#fff" },
      xaxis: { range: [-5, 125], showgrid: false, zeroline: false, visible: false },
      yaxis: { range: [-5, 85], showgrid: false, zeroline: false, visible: false, scaleanchor: "x", scaleratio: 1 },
      legend: { bgcolor: "rgba(0,0,0,0.5)", font: { size: 11 } },
      margin: { t: 8, b: 8, l: 8, r: 8 },
      height: 400
    }, { responsive: true });
  }

  /* ── Win Probability Timeline ──────────────────── */

  function renderTimeline(timeline, homeTeam, awayTeam) {
    const goals = timeline.filter(t => t.shot_outcome === "Goal");

    const shapes = goals.map(g => ({
      type: "line",
      x0: g.minute, x1: g.minute, y0: 0, y1: 1,
      line: { color: g.is_home ? "#6c63ff" : "#e63946", width: 1.5, dash: "dash" }
    }));

    const annotations = goals.map(g => ({
      x: g.minute,
      y: g.is_home ? 0.95 : 0.05,
      text: `${g.is_home ? homeTeam.split(" ").pop() : awayTeam.split(" ").pop()} ${g.home_goals}-${g.away_goals}`,
      showarrow: false,
      font: { color: g.is_home ? "#6c63ff" : "#e63946", size: 10 },
      xanchor: "left"
    }));

    Plotly.newPlot("win-prob", [
      {
        x: timeline.map(t => t.minute),
        y: timeline.map(t => t.p_home_win),
        mode: "lines", name: homeTeam,
        line: { color: "#6c63ff", width: 2.5 }
      },
      {
        x: timeline.map(t => t.minute),
        y: timeline.map(t => t.p_draw),
        mode: "lines", name: "Draw",
        line: { color: "#888", width: 1.5, dash: "dot" }
      },
      {
        x: timeline.map(t => t.minute),
        y: timeline.map(t => t.p_away_win),
        mode: "lines", name: awayTeam,
        line: { color: "#e63946", width: 2.5 }
      }
    ], {
      shapes,
      annotations,
      plot_bgcolor: PLOT_BG,
      paper_bgcolor: BG,
      font: { color: "#fff" },
      xaxis: { title: "Minute", gridcolor: "#2a2a4a", zeroline: false },
      yaxis: { title: "Win Probability", tickformat: ".0%", range: [0, 1], gridcolor: "#2a2a4a", zeroline: false },
      legend: { bgcolor: "rgba(0,0,0,0.5)", font: { size: 11 } },
      margin: { t: 8, b: 40, l: 56, r: 8 },
      height: 400
    }, { responsive: true });
  }

  /* ── Stats Table ───────────────────────────────── */

  function renderStatsTable(shots, homeTeam, awayTeam) {
    const h = shots.filter(s => s.is_home);
    const a = shots.filter(s => !s.is_home);

    const hXg  = h.reduce((s, sh) => s + (sh.xg_pred || 0), 0);
    const aXg  = a.reduce((s, sh) => s + (sh.xg_pred || 0), 0);

    const rows = [
      { label: "Shots",        hv: h.length,                                                              av: a.length,                                                              fmt: v => v },
      { label: "On Target",    hv: h.filter(s => ["Goal","Saved"].includes(s.shot_outcome)).length,       av: a.filter(s => ["Goal","Saved"].includes(s.shot_outcome)).length,       fmt: v => v },
      { label: "xG",           hv: hXg,                                                                   av: aXg,                                                                   fmt: v => v.toFixed(2) },
      { label: "xG / Shot",    hv: h.length ? hXg / h.length : 0,                                        av: a.length ? aXg / a.length : 0,                                        fmt: v => v.toFixed(3) },
    ];

    const el = document.getElementById("stats-table");
    el.innerHTML = `
      <div class="stats-header">
        <span class="sh-home">${homeTeam}</span>
        <span></span>
        <span class="sh-away">${awayTeam}</span>
      </div>
      ${rows.map(row => {
        const total = (row.hv + row.av) || 1;
        const hp = (row.hv / total * 100).toFixed(1);
        const ap = (100 - hp).toFixed(1);
        return `
          <div class="stat-row">
            <span class="stat-val home">${row.fmt(row.hv)}</span>
            <div class="stat-mid">
              <div class="stat-bar">
                <div class="bar-home" style="width:${hp}%"></div>
                <div class="bar-away" style="width:${ap}%"></div>
              </div>
              <span class="stat-label">${row.label}</span>
            </div>
            <span class="stat-val away">${row.fmt(row.av)}</span>
          </div>`;
      }).join("")}
    `;

    document.getElementById("stats-section").style.display = "block";
  }

  /* ── Narrative ─────────────────────────────────── */

  async function fetchNarrative() {
    if (!currentMatchId) return;
    const btn = document.getElementById("narrative-btn");
    const content = document.getElementById("narrative-content");

    btn.disabled = true;
    btn.textContent = "Generating...";
    content.innerHTML = `<div class="narrative-loading">Analysing match data with Claude...</div>`;

    try {
      const res = await fetch(`${API}/matches/${currentMatchId}/narrative`);
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      const data = await res.json();
      renderNarrative(data);
      btn.textContent = "Regenerate";
      btn.disabled = false;
    } catch (err) {
      content.innerHTML = `<div class="narrative-error">Failed to generate analysis: ${err.message}</div>`;
      btn.textContent = "Retry";
      btn.disabled = false;
    }
  }

  function renderNarrative(data) {
    const n = data.narrative;
    const moments = n.key_moments
      .map(m => `<li>${m}</li>`)
      .join("");

    document.getElementById("narrative-content").innerHTML = `
      <p class="narrative-summary">${n.summary}</p>
      <ul class="narrative-moments">${moments}</ul>
      <p class="narrative-tactical">${n.tactical_note}</p>
    `;
  }

  /* ── Pitch helpers ─────────────────────────────── */

  function rect(x0, y0, x1, y1) {
    return { type: "rect", x0, y0, x1, y1, line: { color: "rgba(255,255,255,0.5)", width: 1 } };
  }

  function line(x0, y0, x1, y1) {
    return { type: "line", x0, y0, x1, y1, line: { color: "rgba(255,255,255,0.5)", width: 1 } };
  }

  /* ── Event listeners ───────────────────────────── */

  document.getElementById("comp-select").addEventListener("change", onCompChange);
  document.getElementById("home-select").addEventListener("change", onHomeChange);
  document.getElementById("away-select").addEventListener("change", onAwayChange);
  document.getElementById("narrative-btn").addEventListener("click", fetchNarrative);

  loadMatches();
</script>
</body>
</html>
